
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hundir la Flota</title>

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Distribución principal -->
    <div class="main-layout">

        <!-- PANEL LATERAL -->
        <aside class="info-panel">

            <!-- Flota enemiga -->
            <section class="fleet-section">
                <h2>Flota enemiga</h2>

                <ul id="fleet-status">
                    <!-- JavaScript generará los barcos -->
                </ul>
            </section>

            <!-- Estadísticas -->
            <section class="stats">
                <p>Disparos realizados</p>
                <span id="shot-counter">0</span>
            </section>

            <!-- Clasificación -->
            <section class="leaderboard">
                <h2>Mejores puntuaciones</h2>

                <ol id="score-list">
                    <!-- JavaScript generará las puntuaciones -->
                </ol>
            </section>

        </aside>

        <!-- ZONA PRINCIPAL DEL JUEGO -->
        <main class="game-container">

            <h1>HUNDIR LA FLOTA</h1>

            <p id="message-area">
                Preparando el tablero...
            </p>

            <button id="play-again-btn" style="display: none;">
    Volver a jugar
</button>

            <!-- Tablero de juego -->
            <div id="game-board">
                <!-- JavaScript generará las 100 casillas -->
            </div>

               


        </main>

    </div>

    <!-- Ventana DE FIN DE PARTIDA -->
    <div id="game-over-modal" class="modal-overlay" style="display: none;">

        <div class="modal-content">

            <h2 id="modal-title">¡Victoria!</h2>

            <p id="modal-text">
                Has hundido toda la flota.
            </p>

            <label for="player-name">Nombre del jugador</label>

            <input
                type="text"
                id="player-name"
                placeholder="Introduce tu nombre"
                maxlength="30"
            >

            <button id="save-score-btn">Guardar puntuación</button>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
